<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Hub</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="audio-controls">
        <button id="muteButton" title="Unmute" aria-label="Toggle Mute">
            <svg id="audioIcon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
        </button>
    </div>
    <audio id="musicplayer" preload="auto"></audio>
    <header>
        <h1>Welcome to My Website</h1>
        <nav>
            <ul>
                <li><a href="minecraft.html">Minecraft</a></li>
                <li><a href="archery.html">Archery</a></li>
                <li><a href="infinite.html">Infinite</a></li>
            </ul>
        </nav>
    </header>
    <section class="hub-box intro-section">
        <p style="margin: 0;">Explore my interests using the links above!</p>
    </section>
    <section class="hub-box quiz-section">
        <div class="quiz-container">
            <h3 id="quizTopicTitle">🎯 Loading Quiz...</h3>
            <div class="quiz-card">
                <p id="quizQuestion">Loading question...</p>
                <div id="quizOptions" class="options-grid"></div>
                <p id="quizFeedback" class="feedback-text"></p>
            </div>
            <div class="quiz-footer">
                <span id="quizScore">Score: 0/0</span>
                <button id="nextQuizBtn" style="display: none;">Next Question →</button>
            </div>
        </div>
    </section>
    <script src="music.js"></script>
    <script src="quiz.js"></script>
</body>
</html>
